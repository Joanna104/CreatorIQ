[alembic]
script_location = %(here)s/migrations
# Put the project root on sys.path so migrations/env.py can import the "app" package.
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
# The database URL is NOT set here: migrations/env.py reads it from the application
# settings (DATABASE_URL or POSTGRES_* in the environment / .env), so no credentials
# live in this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
