[project]
name = "creatoriq-backend"
version = "0.1.0"
description = "CreatorIQ backend - Phase 1: foundation (no datasets, no auth, no predictions)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: needs a real PostgreSQL database (set TEST_DATABASE_URL, see README)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
